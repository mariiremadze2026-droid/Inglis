<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ინგლისური 20 დღეში</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ანიმაციური ფონი -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <!-- ჰედერი -->
        <header>
            <h1>🇬🇧 ინგლისური 20 დღეში 🇬🇪</h1>
            <p>500 სიტყვა + 200 სასაუბრო ფრაზა</p>
            <div class="overall-progress">
                <span>საერთო პროგრესი:</span>
                <div class="progress-bar-bg">
                    <div id="total-progress-fill" class="progress-fill"></div>
                </div>
                <span id="total-progress-text">0%</span>
            </div>
        </header>

        <!-- დღეების არჩევა (Tabs) -->
        <nav class="days-nav">
            <label for="day-select">აირჩიე დღე: </label>
            <select id="day-select">
                <!-- შეივსება დინამიურად JS-ით (1-20 დღე) -->
            </select>
        </nav>

        <!-- რეჟიმების გადამრთველი (სწავლა / ტესტი) -->
        <div class="mode-switch">
            <button id="btn-learn-mode" class="mode-btn active">📚 სწავლის რეჟიმი</button>
            <button id="btn-quiz-mode" class="mode-btn">📝 ტესტირება</button>
        </div>

        <!-- 1. სწავლის სექცია -->
        <main id="learning-section" class="content-section active">
            <!-- სიტყვების ბლოკი -->
            <section class="card-group">
                <h2>📖 დღის სიტყვები (25)</h2>
                <div id="words-container" class="cards-grid">
                    <!-- შეივსება JS-ით -->
                </div>
            </section>

            <!-- ფრაზების ბლოკი -->
            <section class="card-group">
                <h2>💬 სასაუბრო ფრაზები (10)</h2>
                <div id="phrases-container" class="cards-grid">
                    <!-- შეივსება JS-ით -->
                </div>
            </section>
        </main>

        <!-- 2. ტესტების სექცია -->
        <main id="quiz-section" class="content-section">
            <div class="quiz-card">
                <div class="quiz-header">
                    <span id="quiz-progress-text">კითხვა 1 / 10</span>
                    <span id="quiz-score-text">ქულა: 0</span>
                </div>
                <div class="quiz-question-box">
                    <h3 id="quiz-question">კითხვის ტექსტი...</h3>
                    <button id="quiz-audio-btn" class="icon-btn audio-btn" style="display:none;">🔊 მოსმენა</button>
                </div>
                <div id="quiz-options" class="options-grid">
                    <!-- სავარაუდო პასუხები JS-ით -->
                </div>
                <button id="next-question-btn" class="action-btn" style="display: none;">შემდეგი კითხვა ➔</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
